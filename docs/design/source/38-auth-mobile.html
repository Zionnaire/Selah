<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SELAH: Account on mobile</title>
<link rel="stylesheet" href="selah.css">
<link rel="stylesheet" href="selah-batch4.css">

</head>
<body class="plain">
<div class="phones">
<figure><div class="phone"><div class="screen"><div class="statusbar"><span>9:41</span><span style="font-weight:500;font-size:12px">5G &nbsp;100%</span></div><div class="m-auth">
  <div class="m-brand"><img class="mark" src="../brand/selah-symbol-navy.svg" alt=""><img class="word" src="../brand/selah-wordmark-navy.svg" alt="SELAH"></div>
  <h1>Sign in</h1><p class="sub">Welcome back. Pick up where you left off.</p>
  <div class="form"><div class="field"><label>Email</label><div class="input " style="">daniel@gracechurch.example</div></div><div class="field"><label>Password</label><div class="pw"><div class="input " style="letter-spacing:2px">••••••••••••</div><span class="eye"><svg class="i " viewBox="0 0 24 24" width="18" height="18" stroke-width="1.7" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></span></div></div>
  <div class="row2"><span></span><a class="link" href="#">Forgot password?</a></div>
  <button class="btn primary block" type="button">Sign in</button><div class="divider">or</div>
  <button class="btn block" type="button">Continue without an account</button></div>
  <p style="margin-top:auto;font-size:14px;color:var(--ink-2);text-align:center">New to SELAH? <a class="link" href="#">Create an account</a></p>
</div></div></div><figcaption>Sign in</figcaption></figure>
<figure><div class="phone"><div class="screen"><div class="statusbar"><span>9:41</span><span style="font-weight:500;font-size:12px">5G &nbsp;100%</span></div><div class="m-auth">
  <div class="m-brand"><img class="mark" src="../brand/selah-symbol-navy.svg" alt=""><img class="word" src="../brand/selah-wordmark-navy.svg" alt="SELAH"></div>
  <h1>Create your account</h1><p class="sub">If you have work on this device, it comes with you.</p>
  <div class="form"><div class="field"><label>Your name</label><div class="input " style="">Daniel Adeyemi</div></div><div class="field"><label>Email</label><div class="input " style="">daniel@gracechurch.example</div></div>
  <div class="field"><label>Password</label><div class="pw"><div class="input focus" style="letter-spacing:2px">••••••••••••</div><span class="eye"><svg class="i " viewBox="0 0 24 24" width="18" height="18" stroke-width="1.7" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></span></div><ul class="checks"><li class="ok"><span class="tick"><svg class="i " viewBox="0 0 24 24" width="11" height="11" stroke-width="1.7" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>At least 10 characters</li><li class="ok"><span class="tick"><svg class="i " viewBox="0 0 24 24" width="11" height="11" stroke-width="1.7" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Letters and a number</li></ul></div>
  <div class="check-row"><span class="box on"><svg class="i " viewBox="0 0 24 24" width="12" height="12" stroke-width="1.7" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span style="font-size:13px">I agree to the <a class="link" href="#">Terms</a> and <a class="link" href="#">Privacy notice</a>.</span></div>
  <button class="btn primary block" type="button">Create account</button></div>
</div></div></div><figcaption>Create account</figcaption></figure>
<figure><div class="phone"><div class="screen"><div class="statusbar"><span>9:41</span><span style="font-weight:500;font-size:12px">5G &nbsp;100%</span></div><div class="m-auth" style="text-align:center;align-items:center">
  <div class="m-brand" style="align-self:flex-start"><img class="mark" src="../brand/selah-symbol-navy.svg" alt=""><img class="word" src="../brand/selah-wordmark-navy.svg" alt="SELAH"></div>
  <div class="icon-badge ok" style="margin-top:60px"><svg class="i " viewBox="0 0 24 24" width="22" height="22" stroke-width="1.7" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></div>
  <h1>Check your email</h1><p class="sub">If an account exists for <b style="color:var(--ink)">daniel@gracechurch.example</b>, a link is on its way. It works for 30 minutes.</p>
  <div class="alert info" style="text-align:left;width:100%;margin-bottom:16px"><svg class="i " viewBox="0 0 24 24" width="16" height="16" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span>Nothing arrived? Check spam, and the spelling of the address.</span></div>
  <button class="btn block dis" type="button">Send again in 0:42</button>
  <p class="alt-note"><a class="link" href="#">Use a different email</a></p>
</div></div></div><figcaption>Check your email</figcaption></figure>
</div>
</body>
</html>

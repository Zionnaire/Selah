<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SELAH: Sync on mobile</title>
<link rel="stylesheet" href="selah.css">
<link rel="stylesheet" href="selah-batch4.css">

</head>
<body class="plain">
<div class="phones">
<figure><div class="phone"><div class="screen"><div class="statusbar"><span>9:41</span><span style="font-weight:500;font-size:12px">5G &nbsp;100%</span></div><div class="m-top"><svg class="i " viewBox="0 0 24 24" width="20" height="20" stroke-width="1.7" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><h2>Resolve differences</h2><span class="chip warn">1</span></div>
<div style="padding:16px 18px">
  <b style="font:600 24px var(--font-display);color:var(--navy);display:block">2. Rejecting conformity</b>
  <p class="small muted" style="margin:6px 0 0">Changed on this phone and your iPad. Highlighted words are the differences.</p>
  <div class="tabs2"><span class="on">This phone</span><span>iPad</span></div>
  <div class="ver on" style="padding:14px 16px"><div class="hd"><span class="ico"><svg class="i " viewBox="0 0 24 24" width="16" height="16" stroke-width="1.7" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg></span><div><b>This phone</b><small>Edited today at 09:14</small></div></div>
  <div class="txt" style="font-size:15.5px"><p>The world presses its shape onto us every day. <span class="chg">It does not announce itself.</span> Conformity is quiet.</p><p>&ldquo;Be not conformed&rdquo; is a command. <span class="chg">Hold up the clay.</span></p></div>
  <div class="pick"><span class="radio"></span>Keep this version</div></div>
  <div class="both" style="font-size:13.5px"><span class="radio"></span><div><b>Keep both</b><div class="small muted">Adds the iPad version as a copy.</div></div></div>
</div>
<div style="position:absolute;left:0;right:0;bottom:0;padding:12px 18px 28px;background:var(--stone-100);border-top:1px solid var(--stone-200);display:flex;gap:10px"><button class="btn" style="flex:1;justify-content:center" type="button">Decide later</button><button class="btn primary" style="flex:1;justify-content:center" type="button">Save choice</button></div></div></div><figcaption>Conflict, one section at a time</figcaption></figure>
<figure><div class="phone"><div class="screen"><div class="statusbar"><span>9:41</span><span style="font-weight:500;font-size:12px">5G &nbsp;100%</span></div><div class="m-top"><h2>Notifications</h2><span style="font-size:13px;font-weight:600;color:var(--ink-2)">Mark all read</span></div>
<div class="group" style="padding:12px 18px 2px;font:600 12px var(--font-ui);color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em">Needs you</div>
<div class="nitem unread"><span class="ico warn"><svg class="i " viewBox="0 0 24 24" width="18" height="18" stroke-width="1.7" aria-hidden="true"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg></span><div><b>A sermon changed on two devices</b><p>One section needs your choice.</p><div class="when">Today, 09:20</div><div class="acts"><button class="btn primary sm" type="button">Review</button></div></div></div>
<div class="nitem unread"><span class="ico sec"><svg class="i " viewBox="0 0 24 24" width="18" height="18" stroke-width="1.7" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg></span><div><b>New sign in to your account</b><p>Chrome on Windows, 09:02.</p><div class="when">Today, 09:02</div><div class="acts"><button class="btn sm" type="button">That was me</button><button class="btn sm danger" type="button">Secure</button></div></div></div>
<div class="group" style="padding:12px 18px 2px;font:600 12px var(--font-ui);color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em">Earlier</div>
<div class="nitem "><span class="ico ok"><svg class="i " viewBox="0 0 24 24" width="18" height="18" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></span><div><b>Berean Standard Bible is ready offline</b><p>Stored on this device.</p><div class="when">Yesterday</div></div></div>
<div class="nitem "><span class="ico info"><svg class="i " viewBox="0 0 24 24" width="18" height="18" stroke-width="1.7" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></span><div><b>A new version is ready</b><p>Reload when it suits you.</p><div class="when">12 Nov</div></div></div></div></div><figcaption>Notification centre</figcaption></figure>
<figure><div class="phone"><div class="screen"><div class="statusbar"><span>9:41</span><span style="font-weight:500;font-size:12px">5G &nbsp;100%</span></div><div class="m-top"><h2>Settings</h2></div><div style="padding:16px 18px;opacity:.5"><div class="cardx" style="height:90px;margin-bottom:12px"></div><div class="cardx" style="height:90px"></div></div>
<div class="scrim"></div>
<div class="sheet-bottom"><div class="grab"></div>
  <div class="status-hero" style="padding:14px;margin-bottom:14px"><span class="badge" style="width:40px;height:40px"><svg class="i " viewBox="0 0 24 24" width="20" height="20" stroke-width="1.7" aria-hidden="true"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg></span><div style="flex:1"><div class="big" style="font-size:19px">Everything is backed up</div><div class="small muted">Synced 2 minutes ago</div></div></div>
  <button class="btn block" type="button" style="margin-bottom:12px"><svg class="i " viewBox="0 0 24 24" width="15" height="15" stroke-width="1.7" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg> Sync now</button>
  <div class="devices"><div class="dev"><span class="ico"><svg class="i " viewBox="0 0 24 24" width="18" height="18" stroke-width="1.7" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg></span><div><b>This phone</b><small>Active now</small></div><span></span></div><div class="dev"><span class="ico"><svg class="i " viewBox="0 0 24 24" width="18" height="18" stroke-width="1.7" aria-hidden="true"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/></svg></span><div><b>Windows laptop</b><small>Synced 2 minutes ago</small></div><span></span></div></div>
  <p class="small muted" style="margin:12px 0 0">Offline, your work is saved on this phone and sends when you are back online.</p>
</div></div></div><figcaption>Sync status sheet</figcaption></figure>
</div>
</body>
</html>
